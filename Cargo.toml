[package]
name = "private-vault"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "=0.8.9", features = ["json"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
webauthn-rs = { version = "=0.6.2", default-features = false }

[dev-dependencies]
crypto-glue = "=0.2.2"
webauthn-authenticator-rs = { version = "=0.6.2", default-features = false, features = ["softpasskey"] }
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Temporary dependency compatibility backports; see vendor/README.md.
[patch.crates-io]
sqlx-sqlite = { path = "vendor/sqlx-sqlite" }
crypto-glue = { path = "vendor/crypto-glue" }
sqlx-mysql = { path = "vendor/sqlx-mysql" }
